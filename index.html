<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #fff; --fg: #111; --muted: #6b6b6b; --faint: #bdbdbd; --line: #e6e6e6;
  --day-bg: #f1f1f1; --today-bg: #dde8ff; --accent: #1a5fe0;
  /* The accent and the types stay apart for protan, deutan and tritan vision (CIEDE2000 >= 12).
     Each color has a contrast of 4.5:1 or more on the background. */
  --lek: #6b6b6b; --pr: #2a8250; --lab: #df0520; --kp: #8c3085; --err: #c00;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212; --fg: #e9e9e9; --muted: #9c9c9c; --faint: #4f4f4f; --line: #262626;
    --day-bg: #1d1d1d; --today-bg: #1b2b48; --accent: #6394fa;
    --lek: #9c9c9c; --pr: #85f0ad; --lab: #fd1429; --kp: #f0b0ea; --err: #ff6b6b;
  }
}
* { box-sizing: border-box; }
/* "contain" stops Chrome's pull-to-refresh. The data reloads each time the app comes to the front. */
html, body { margin: 0; background: var(--bg); color: var(--fg); overscroll-behavior-y: contain; }
body {
  font: 15px/1.3 system-ui, Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  -webkit-tap-highlight-color: transparent;
  touch-action: pan-y pinch-zoom;
}
/* The bar is at the bottom of the screen, near the thumb. The panel with the details is above the header. */
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1; background: var(--bg); border-top: 1px solid var(--line); }
#bar:has(#sheet:not([hidden])) { box-shadow: 0 -2px 8px rgb(0 0 0 / .15); }
header {
  display: flex; justify-content: space-between; align-items: stretch;
  padding: 4px calc(env(safe-area-inset-right) + 4px) calc(env(safe-area-inset-bottom) + 4px) calc(env(safe-area-inset-left) + 4px);
}
#sheet:not([hidden]) + header { border-top: 1px solid var(--line); }
button, #pick {
  font: inherit; color: var(--muted); background: none; border: 1px solid var(--line);
  border-radius: 4px; padding: 3px 10px; display: flex; align-items: center;
}
button.on, #pick.on { color: var(--fg); border-color: var(--fg); font-weight: 600; }
#wk { display: flex; align-items: center; padding-left: 2px; font-weight: 600; }
#prev, #next { padding: 3px 7px; }
#pick { position: relative; }
#pick input { position: absolute; inset: 0; width: 100%; opacity: 0; }
#nav { display: flex; gap: 4px; }
/* Both labels share one grid cell, so the button keeps its width when the label changes. */
#mode { display: grid; padding: 3px 8px; }
#mode span { grid-area: 1 / 1; align-self: center; text-align: center; }
#mode.list span.to-list, #mode.grid span.to-grid { visibility: hidden; }
svg { display: block; fill: currentColor; }
#err { color: var(--err); padding: 4px; white-space: pre-wrap; }
#err:empty { display: none; }
table { width: 100%; border-collapse: collapse; }
td { padding: 3px 4px; white-space: nowrap; vertical-align: baseline; }
.лек { color: var(--lek); } .пр { color: var(--pr); } .лаб { color: var(--lab); } .КП { color: var(--kp); }
.none { color: var(--faint); }
/* A building other than the building of the previous class. */
.mv { font-weight: 700; color: var(--fg); }

/* The list: one row for each class. */
tr.day td { background: var(--day-bg); font-size: 13px; font-weight: 600; color: var(--muted); }
tr.day.today td { background: var(--today-bg); color: var(--accent); }
tr.day .span { float: right; }
tr.c td, tr.gap td { border-top: 1px solid var(--line); }
tr.day + tr td { border-top: 0; }
td.t, td.k, td.rn, td.rs, td.rb { width: 1%; }
td.k { font-size: 13px; }
td.rn { text-align: right; padding-right: 0; }
td.rs { padding: 0 .2em; color: var(--muted); text-align: center; }
td.k.none { text-align: center; }
/* The dash of an empty room is centered on the slash column, so it lines up with the slashes.
   The zero-width box keeps the column as narrow as a slash. */
td.rs .none { display: inline-flex; justify-content: center; width: 0; }
td.rb { padding-left: 0; }
td.s { width: 100%; }
td.w { padding-left: 12px; color: var(--muted); max-width: 8.5em; overflow: hidden; text-overflow: ellipsis; }
tr.gap td { color: var(--faint); }
tr.now td.t { box-shadow: inset 3px 0 var(--accent); }
tr.c.now td.t { font-weight: 700; }
tr.c.next td.t { color: var(--accent); }
tr.wait td { color: var(--accent); font-size: 13px; padding: 1px 4px; border-top: 2px solid var(--accent); }
tr.det td { color: var(--muted); font-size: 13px; white-space: normal; padding-top: 0; }
tr.det[hidden] { display: none; }
td.split .sep { display: none; }
td.split .tn { display: block; }

/* The grid: slots in rows, days in columns, two weeks. */
table.grid { table-layout: fixed; }
.grid col.tc { width: 2.9em; }
.grid + .grid { margin-top: 10px; }
.grid th { font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 3px; text-align: left; white-space: nowrap; }
.grid tr:first-child th { background: var(--day-bg); }
.grid tr:first-child th.today { background: var(--today-bg); color: var(--accent); }
.grid tr + tr th { vertical-align: top; padding-top: 4px; font-weight: 400; }
.grid td { padding: 2px 1px; vertical-align: top; border-top: 1px solid var(--line); }
.grid td.today { background: color-mix(in srgb, var(--today-bg) 45%, transparent); }
.grid .past { opacity: .45; }
.gi { border-left: 3px solid var(--faint); border-radius: 2px; padding: 1px 3px; }
.gi + .gi { margin-top: 2px; }
.gi > b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.gi small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.gi[data-k="лек"] { border-color: var(--lek); } .gi[data-k="пр"] { border-color: var(--pr); }
.gi[data-k="лаб"] { border-color: var(--lab); } .gi[data-k="КП"] { border-color: var(--kp); }
.gi.now { outline: 2px solid var(--accent); outline-offset: -2px; }
.gi.next > b { color: var(--accent); }
.gi.sel { background: var(--line); }
/* The details of the class tapped in the grid. */
#sheet { padding: 8px calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px); }
#sheet[hidden] { display: none; }
#sheet .sh1 { font-size: 13px; color: var(--muted); }
#sheet .sh2 { font-weight: 600; margin: 2px 0; }
#sheet .dot { margin: 0 .5em; }
#sheet .sl { margin: 0 .08em; }
</style>
</head>
<body>
<div id="err"></div>
<div id="view"></div>
<div id="bar">
<div id="sheet" hidden></div>
<header>
  <span id="wk"></span>
  <span id="nav">
  <button id="prev" type="button" aria-label="предыдущая неделя">
    <svg width="10" height="14" viewBox="0 0 10 14"><path d="M8 1 2 7l6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <label id="pick"><span id="range"></span><input id="date" type="date" aria-label="выбрать неделю"></label>
  <button id="next" type="button" aria-label="следующая неделя">
    <svg width="10" height="14" viewBox="0 0 10 14"><path d="M2 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  </span>
  <button id="mode" type="button"><span class="to-grid">сетка</span><span class="to-list">список</span></button>
</header>
</div>
<script>
'use strict';
const DAYS = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const DAY_MS = 864e5;

// Split a line into fields. A quoted field can hold spaces. "#" starts a comment.
function tokenize(line) {
  const out = [];
  let i = 0;
  while (i < line.length) {
    if (/\s/.test(line[i])) { i++; continue; }
    if (line[i] === '#') break;
    if (line[i] === '"') {
      const j = line.indexOf('"', i + 1);
      if (j < 0) throw new Error('нет закрывающей кавычки');
      out.push(line.slice(i + 1, j));
      i = j + 1;
    } else {
      let j = i;
      while (j < line.length && !/\s/.test(line[j])) j++;
      out.push(line.slice(i, j));
      i = j;
    }
  }
  return out;
}

function parse(text) {
  const s = { week1: null, slots: [], names: {}, profs: {}, classes: [], errors: [] };
  text.split(/\r?\n/).forEach((line, n) => {
    try {
      const f = tokenize(line);
      if (!f.length) return;
      const [key] = f;
      if (key === 'week1') {
        const d = parseDate(f[1]);
        if (!d) throw new Error('дата должна быть ГГГГ-ММ-ДД');
        s.week1 = mondayOf(d);
      } else if (key === 'slot') {
        if (!isTime(f[1]) || !isTime(f[2])) throw new Error('slot начало конец, например slot 12:00 13:35');
        s.slots.push({ start: f[1], end: f[2] });
      } else if (key === 'name') {
        if (f.length !== 3) throw new Error('name короткое "полное имя"');
        s.names[f[1]] = f[2];
      } else if (key === 'prof') {
        if (f.length < 3) throw new Error('prof фамилия имя отчество, например prof Иванова Анна Петровна');
        if (s.profs[f[1]]) throw new Error('этот преподаватель уже есть в строке ' + s.profs[f[1]].line);
        s.profs[f[1]] = { given: f.slice(2).join(' '), line: n + 1, text: line.trim(), used: false };
      } else if (DAYS.includes(key)) {
        if (f.length < 6 || f.length > 7) throw new Error('нужно 6 или 7 полей: день начало неделя тип предмет аудитория ["преподаватель"]');
        const [day, start, week, type, subj, room, teacher = ''] = f;
        if (!isTime(start)) throw new Error('время должно быть ЧЧ:ММ');
        if (!['1', '2', '-'].includes(week)) throw new Error('неделя: 1, 2 или -');
        if (teacher.includes('.')) throw new Error('преподаватель: только фамилия. Имя и отчество пишите в строке prof');
        const [num, bld = ''] = room === '-' ? [''] : room.split('/');
        s.classes.push({ day: DAYS.indexOf(day), start, week, type: type === '-' ? '' : type, subj, num, bld, teacher });
      } else {
        throw new Error('неизвестное начало строки: ' + key);
      }
    } catch (e) {
      s.errors.push(`строка ${n + 1}: ${e.message}\n  ${line.trim()}`);
    }
  });
  if (!s.week1) s.errors.push('нет строки week1 ГГГГ-ММ-ДД');
  for (const c of s.classes) {
    c.slot = s.slots.find(x => x.start === c.start);
    if (!c.slot) s.errors.push(`нет пары с началом ${c.start} (${DAYS[c.day]} ${c.subj})`);
    // The "prof" line with the surname gives the first name and the patronymic.
    const p = s.profs[c.teacher];
    if (p) p.used = true;
    c.full = p ? c.teacher + ' ' + p.given : c.teacher;
  }
  for (const p of Object.values(s.profs)) {
    if (!p.used) s.errors.push(`строка ${p.line}: нет занятий у этого преподавателя\n  ${p.text}`);
  }
  return s;
}

function parseDate(v) {
  const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(v || '');
  return m ? new Date(+m[1], m[2] - 1, +m[3]) : null;
}
function isoDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isTime(t) { return /^\d?\d:\d\d$/.test(t || ''); }
function minutes(t) { const [h, m] = t.split(':'); return h * 60 + +m; }
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - (x.getDay() + 6) % 7);
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function weekNo(monday) {
  const diff = Math.round((monday - sched.week1) / (7 * DAY_MS));
  return ((diff % 2) + 2) % 2 === 0 ? 1 : 2;
}
function esc(v) {
  return String(v).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}
// A month name is faster to read than a month number: "28 сен".
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
function dmon(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
// "28 сен – 4 окт", or "5 – 11 окт" in one month.
function dates(a, b) { return (a.getMonth() === b.getMonth() ? a.getDate() : dmon(a)) + ' – ' + dmon(b); }
function duration(m) { return m < 60 ? m + ' мин' : Math.floor(m / 60) + ' ч' + (m % 60 ? ' ' + m % 60 + ' мин' : ''); }

let sched = null;
let picked = null;         // Monday of the week to show. null means the relevant week.
let openKey = null;        // The class with the details shown.
let focusDay = -1;         // The day of the list to scroll to.
let shown = new Map();     // The classes on the screen, by key.
let mode = 'list';
try { if (localStorage.getItem('mode') === 'grid') mode = 'grid'; } catch (e) {}

// On Saturday and Sunday the next week is the relevant one.
function relevantMonday() {
  const now = new Date();
  const m = mondayOf(now);
  return (now.getDay() + 6) % 7 >= 5 ? addDays(m, 7) : m;
}
function shownMonday() { return picked || relevantMonday(); }
function show(monday) {
  picked = +monday === +relevantMonday() ? null : monday;
  render();
  scrollToFocus();
}
function lastDay() { return sched.classes.some(c => c.day === 5) ? 5 : 4; }

// The classes of one day, with the now or next mark and the building changes.
function dayOf(monday, d, now) {
  const date = addDays(monday, d);
  const week = weekNo(monday);
  const today = isoDate(date) === isoDate(now);
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const list = sched.classes
    .filter(c => c.day === d && c.slot && (c.week === '-' || +c.week === week))
    .sort((a, b) => minutes(a.start) - minutes(b.start))
    .map(c => ({ c, date, key: isoDate(date) + ' ' + c.start + ' ' + c.subj, state: '', moved: false }));
  let bld = '';
  for (const e of list) {
    e.moved = !!(bld && e.c.bld && e.c.bld !== bld);
    if (e.c.bld) bld = e.c.bld;
    shown.set(e.key, e);
  }
  if (today) {
    const cur = list.find(e => minutes(e.c.start) <= nowMin && nowMin < minutes(e.c.slot.end));
    const next = list.find(e => minutes(e.c.start) > nowMin);
    if (cur) cur.state = 'now';
    else if (next) next.state = 'next';
  }
  return {
    d, date, list, today,
    past: !today && date < now,
    over: today && (!list.length || nowMin >= minutes(list[list.length - 1].c.slot.end)),
  };
}

function render() {
  if (!sched || !sched.week1) return;
  const now = new Date();
  const monday = shownMonday();
  const weeks = mode === 'grid' ? 2 : 1;

  document.getElementById('wk').textContent = 'неделя ' + weekNo(monday);
  document.getElementById('range').textContent = dates(monday, addDays(monday, 7 * weeks - 1));
  document.getElementById('pick').classList.toggle('on', +monday !== +relevantMonday());
  document.getElementById('date').value = isoDate(monday);
  document.getElementById('mode').className = mode;

  shown = new Map();
  focusDay = -1;
  const view = document.getElementById('view');
  view.innerHTML = mode === 'grid' ? gridWeek(monday, now) + gridWeek(addDays(monday, 7), now) : listWeek(monday, now);
  if (!shown.has(openKey)) openKey = null;
  view.querySelectorAll('tr.det:not([hidden]) td.d').forEach(fit);
  sheet();
}

function listWeek(monday, now) {
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const html = [];
  let todayOver = false;
  for (let d = 0; d <= lastDay(); d++) {
    const day = dayOf(monday, d, now);
    const { list } = day;
    // Scroll to today. When today has no more classes, scroll to the next day with classes.
    if (day.today) { focusDay = d; todayOver = day.over; }
    else if (todayOver && list.length) { focusDay = d; todayOver = false; }
    const span = list.length ? `<span class="span">${list[0].c.start} – ${list[list.length - 1].c.slot.end}</span>` : '';
    html.push(`<tr class="day${day.today ? ' today' : ''}" data-day="${d}"><td colspan="7">${DAYS[d].toUpperCase()} ${dmon(day.date)}${span}</td></tr>`);
    if (!list.length) continue;

    // Free slots between the first and the last class of the day.
    const rows = [];   // [start in minutes, html]
    const first = sched.slots.indexOf(list[0].c.slot);
    const last = sched.slots.indexOf(list[list.length - 1].c.slot);
    for (let i = first; i <= last; i++) {
      const slot = sched.slots[i];
      const here = list.filter(e => e.c.slot === slot);
      if (!here.length) rows.push([minutes(slot.start), `<tr class="gap"><td class="t">${slot.start}</td><td colspan="6"></td></tr>`]);
      for (const e of here) rows.push([minutes(e.c.start), row(e)]);
    }
    // Before a class and during a break, a line above the next class shows the time to wait.
    const next = list.find(e => e.state === 'next');
    if (next) {
      const wait = duration(minutes(next.c.start) - nowMin);
      const text = minutes(list[0].c.start) < nowMin ? 'перерыв, ещё ' + wait : 'до начала ' + wait;
      rows.splice(rows.findIndex(r => r[0] > nowMin), 0, [0, `<tr class="wait"><td colspan="7">${text}</td></tr>`]);
    }
    for (const r of rows) html.push(r[1]);
  }
  return `<table class="list">${html.join('')}</table>`;
}

function roomHtml(c, moved, slash = '/') {
  const bld = moved ? `<span class="mv">${esc(c.bld)}</span>` : esc(c.bld);
  return esc(c.num) + (c.bld ? slash + bld : '');
}

function row(e) {
  const { c } = e;
  const full = sched.names[c.subj] || c.subj;
  const st = e.state ? ' ' + e.state : '';
  const room = c.num || c.bld
    ? `<td class="rn">${esc(c.num)}</td><td class="rs">${c.bld ? '/' : ''}</td><td class="rb${e.moved ? ' mv' : ''}">${esc(c.bld)}</td>`
    : '<td class="rn"></td><td class="rs"><span class="none">—</span></td><td class="rb"></td>';
  const type = c.type ? `<td class="k ${esc(c.type)}">${esc(c.type)}</td>` : '<td class="k none">—</td>';
  const parts = [full !== c.subj ? `<span class="fn">${esc(full)}</span>` : '', c.full ? `<span class="tn">${esc(c.full)}</span>` : ''];
  const det = parts.filter(Boolean).join('<span class="sep"> · </span>');
  return `<tr class="c${st}" data-key="${esc(e.key)}"><td class="t">${c.start}</td>${type}` +
    `<td class="s">${esc(c.subj)}</td>${room}<td class="w">${esc(c.teacher)}</td></tr>` +
    `<tr class="det${st}"${e.key === openKey ? '' : ' hidden'}><td class="t">${c.slot.end}</td><td class="d" colspan="6">${det}</td></tr>`;
}

// Put the teacher on a separate line if "name · teacher" does not fit on one line.
const ruler = document.createElement('canvas').getContext('2d');
function fit(td) {
  const tn = td.querySelector('.tn');
  if (!tn || !td.querySelector('.fn')) return;
  const cs = getComputedStyle(td);
  // cs.font is empty here: "font-variant-numeric" cannot go into the shorthand.
  ruler.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const room = td.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  td.classList.toggle('split', ruler.measureText(td.textContent).width > room);
}
addEventListener('resize', () => document.querySelectorAll('tr.det:not([hidden]) td.d').forEach(fit));

function gridWeek(monday, now) {
  const days = [];
  for (let d = 0; d <= lastDay(); d++) days.push(dayOf(monday, d, now));
  const cls = x => [x.today && 'today', x.past && 'past'].filter(Boolean).join(' ');
  let h = `<table class="grid"><colgroup><col class="tc">${'<col>'.repeat(days.length)}</colgroup>` +
    `<tr><th></th>${days.map(x => `<th class="${cls(x)}">${DAYS[x.d]} ${x.date.getDate()}</th>`).join('')}</tr>`;
  for (const slot of sched.slots) {
    h += `<tr><th>${slot.start}</th>` +
      days.map(x => `<td class="${cls(x)}">${x.list.filter(e => e.c.slot === slot).map(cell).join('')}</td>`).join('') + '</tr>';
  }
  return h + '</table>';
}

function cell(e) {
  const { c } = e;
  const cls = (e.state ? ' ' + e.state : '') + (e.key === openKey ? ' sel' : '');
  return `<div class="gi${cls}" data-k="${esc(c.type)}" data-key="${esc(e.key)}">` +
    `<b>${esc(c.subj)}</b><small>${roomHtml(c, e.moved) || '&nbsp;'}</small></div>`;
}

// The details of the class tapped in the grid.
function sheet() {
  const el = document.getElementById('sheet');
  const e = mode === 'grid' && shown.get(openKey);
  el.hidden = !e;
  if (!e) return;
  const { c } = e;
  const dot = '<span class="dot">·</span>';
  const type = c.type ? `${dot}<span class="${esc(c.type)}">${esc(c.type)}</span>` : '';
  // The room is one value to read, so it has one color and one weight here.
  el.innerHTML = `<div class="sh1">${DAYS[c.day].toUpperCase()} ${dmon(e.date)}${dot}${c.start} – ${c.slot.end}${type}</div>` +
    `<div class="sh2">${esc(sched.names[c.subj] || c.subj)}</div>` +
    `<div>${[roomHtml(c, false, '<span class="sl">/</span>'), esc(c.full)].filter(Boolean).join(dot)}</div>`;
}

// Put the focus day at the top of the screen. The grid and another week start at the top.
// The app sets the scroll position, so the browser must not restore an old one after a reload.
history.scrollRestoration = 'manual';
function scrollToFocus() {
  padBar();   // The ResizeObserver runs too late: without the free space, the page can be too short to scroll.
  const tr = mode === 'list' && focusDay >= 0 && document.querySelector(`#view tr.day[data-day="${focusDay}"]`);
  scrollTo(0, tr ? tr.getBoundingClientRect().top + scrollY : 0);
}
// The page ends with free space as high as the bar, so the bar does not cover the last rows.
function padBar() { document.body.style.paddingBottom = document.getElementById('bar').offsetHeight + 'px'; }
new ResizeObserver(padBar).observe(document.getElementById('bar'));

function step(n) { show(addDays(shownMonday(), 7 * n)); }
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('date').onchange = e => { const d = parseDate(e.target.value); if (d) show(mondayOf(d)); };
function setMode(m) {
  mode = m;
  openKey = null;
  try { localStorage.setItem('mode', mode); } catch (e) {}
  render();
  scrollToFocus();
}
document.getElementById('mode').onclick = () => setMode(mode === 'list' ? 'grid' : 'list');
// A tap on a class shows its details. A second tap, or a tap on the details, hides them.
document.getElementById('view').onclick = e => {
  const el = e.target.closest('tr.c, .gi');
  openKey = el && el.dataset.key !== openKey ? el.dataset.key : null;
  render();
};
document.getElementById('sheet').onclick = () => { openKey = null; render(); };

// Swipe left for the next week, right for the previous week.
// The body has "touch-action: pan-y", so the browser leaves horizontal moves to this code.
let t0 = null;
addEventListener('touchstart', e => {
  t0 = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
addEventListener('touchcancel', () => { t0 = null; });
addEventListener('touchend', e => {
  if (!t0 || !sched) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - t0.x, dy = t.clientY - t0.y;
  t0 = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > 2 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
});

// When the app comes back to the front, go to the relevant week again.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { picked = null; load(); }
});
setInterval(() => { if (document.visibilityState === 'visible') render(); }, 60e3);

function load() {
  return fetch('schedule.txt', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('schedule.txt: HTTP ' + r.status); return r.text(); })
    .then(text => {
      sched = parse(text);
      document.getElementById('err').textContent = sched.errors.join('\n');
      render();
      scrollToFocus();
    })
    .catch(e => { document.getElementById('err').textContent = e.message; });
}
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
